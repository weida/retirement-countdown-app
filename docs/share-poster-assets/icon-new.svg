<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 1. 背景：深绿色 -->
  <rect width="128" height="128" rx="36" fill="#126C62"/>
  
  <!-- 2. 极其简化的沙漏轮廓 (仅保留上下横梁) -->
  <path d="M44 32 H84 M44 96 H84" fill="none" stroke="#FFFDF8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- 3. 下半部：实心三角形 (代表积攒的自由，视觉最稳固) -->
  <path d="M44 96 L64 64 L84 96 Z" fill="#FFFDF8"/>
  
  <!-- 4. 核心寓意：金色旭日 (象征目标，对比度最高) -->
  <circle cx="64" cy="82" r="15" fill="#D4A76A"/>
  
  <!-- 5. 上半部：隐约的轮廓 (仅一条极细的虚线，不干扰视觉) -->
  <path d="M48 36 L64 60 L80 36" fill="none" stroke="#FFFDF8" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>
