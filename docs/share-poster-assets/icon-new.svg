<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 1. 背景：深绿色圆角矩形 (#126C62) -->
  <rect width="128" height="128" rx="36" fill="#126C62"/>
  
  <!-- 2. 核心图形：米白色倒计时环 (#FFFDF8) -->
  <!-- 
    设计逻辑：
    - 粗壮的圆环确保在小尺寸下清晰可见。
    - 右上角的缺口（约 1/4 弧度）直观表达“剩余/倒计时”的概念。
    - 仅使用两色，追求极致克制与安静。
  -->
  <path d="M64 24 
           A40 40 0 1 1 88 40" 
        fill="none" 
        stroke="#FFFDF8" 
        stroke-width="14" 
        stroke-linecap="round" 
        transform="translate(0, 0)"/>
</svg>
